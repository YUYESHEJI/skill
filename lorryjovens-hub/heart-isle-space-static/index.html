  <style>
    :root {
      --color-warm-white: #FAF9F6;
      --color-warm-gray: #F5F3EF;
      --color-stone: #E8E4DE;
      --color-ochre: #B8956B;
      --color-ochre-light: #D4AE88;
      --color-deep-green: #4A5D54;
      --color-deep-green-light: #5D7268;
      --color-charcoal: #2C2C2C;
      --color-muted: #7A7A7A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--color-warm-white);
      color: var(--color-charcoal);
      overflow-x: hidden;
      cursor: none;
    }

    .font-serif-sc { font-family: 'Noto Serif SC', serif; }

    /* ─── Custom Cursor ─── */
    .cursor-dot, .cursor-outline {
      position: fixed;
      top: 0; left: 0;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 99999;
      pointer-events: none;
      will-change: transform;
    }
    .cursor-dot {
      width: 6px; height: 6px;
      background-color: var(--color-ochre);
      transition: width .2s, height .2s, background .2s;
    }
    .cursor-outline {
      width: 38px; height: 38px;
      border: 1.5px solid var(--color-ochre);
      opacity: 0.6;
      transition: width .4s cubic-bezier(.23,1,.32,1),
                  height .4s cubic-bezier(.23,1,.32,1),
                  opacity .4s, background .4s;
    }
    body:has(a:hover) .cursor-outline,
    body:has(button:hover) .cursor-outline {
      width: 72px; height: 72px;
      background: rgba(184,149,107,.12);
      border-color: transparent;
      opacity: 1;
    }

    /* ─── Grain Overlay ─── */
    .grain-overlay {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9990;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px;
    }

    /* ─── Glass Card ─── */
    .glass-card {
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 8px 32px rgba(31,38,135,.06);
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--color-warm-gray); }
    ::-webkit-scrollbar-thumb { background: var(--color-ochre); border-radius: 3px; }

    /* ─── Keyframes ─── */
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-18px); }
    }
    @keyframes breathe {
      0%,100% { transform: scale(1);    opacity: .7; }
      50%      { transform: scale(1.06); opacity: 1; }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: .6; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .animate-float   { animation: float   6s ease-in-out infinite; }
    .animate-breathe { animation: breathe 4s ease-in-out infinite; }
    .animate-rotate  { animation: rotate-slow 20s linear infinite; }

    /* ─── Liquid Button ─── */
    .liquid-btn {
      position: relative; overflow: hidden; z-index: 1;
      transition: color .5s;
    }
    .liquid-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: var(--color-deep-green);
      transform: scaleX(0); transform-origin: right;
      transition: transform .6s cubic-bezier(.23,1,.32,1);
      z-index: -1;
    }
    .liquid-btn:hover::before { transform: scaleX(1); transform-origin: left; }
    .liquid-btn:hover { color: white; }

    /* ─── Tilt Card ─── */
    .tilt-card { transform-style: preserve-3d; }
    .tilt-inner { transform: translateZ(40px); }

    /* ─── Marquee ─── */
    .marquee-track {
      display: flex;
      animation: marquee 28s linear infinite;
      width: max-content;
    }
    .marquee-track:hover { animation-play-state: paused; }

    /* ─── Text clip reveal ─── */
    .clip-reveal { clip-path: inset(0 100% 0 0); }
    .clip-reveal.revealed { clip-path: inset(0 0% 0 0); transition: clip-path 1.1s cubic-bezier(.77,0,.175,1); }

    /* ─── Shimmer text ─── */
    .shimmer-text {
      background: linear-gradient(90deg, var(--color-ochre) 0%, #f5d5a8 40%, var(--color-ochre) 60%, #c9a478 100%);
      background-size: 200%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }

    /* ─── Magnetic Button ─── */
    .mag-btn {
      transition: transform .35s cubic-bezier(.23,1,.32,1),
                  box-shadow .35s cubic-bezier(.23,1,.32,1);
    }

    /* ─── Section reveal ─── */
    .sr { opacity: 0; transform: translateY(36px); }
    .sr.visible { opacity: 1; transform: translateY(0); transition: opacity .9s, transform .9s cubic-bezier(.16,1,.3,1); }

    /* ─── Nav ─── */
    .nav-scrolled {
      background: rgba(250,249,246,.88) !important;
      backdrop-filter: blur(20px);
      box-shadow: 0 1px 20px rgba(0,0,0,.06);
    }

    /* ─── Hero particles ─── */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* ─── Stats counter ─── */
    .stat-num {
      font-variant-numeric: tabular-nums;
    }

    /* ─── Card hover glow ─── */
    .card-glow {
      position: absolute; inset: -2px; border-radius: inherit;
      background: linear-gradient(135deg, var(--color-ochre), var(--color-deep-green));
      opacity: 0; z-index: -1; filter: blur(12px);
      transition: opacity .4s;
    }
    .tilt-card:hover .card-glow { opacity: .22; }

    /* ─── Progress bar ─── */
    .progress-line {
      height: 2px;
      background: linear-gradient(90deg, var(--color-ochre), var(--color-deep-green));
      transform-origin: left;
      transform: scaleX(0);
      transition: transform .5s ease;
    }

    /* ─── Active nav dot ─── */
    .nav-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--color-ochre);
      display: inline-block; margin-right: 6px;
      opacity: 0; transition: opacity .3s;
    }
    .nav-link.active .nav-dot { opacity: 1; }

    /* ─── Form ─── */
    .form-input {
      width: 100%; padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid #e5e5e5;
      background: rgba(250,249,246,.8);
      outline: none; font-size: 15px;
      transition: border-color .3s, box-shadow .3s;
    }
    .form-input:focus {
      border-color: var(--color-ochre);
      box-shadow: 0 0 0 4px rgba(184,149,107,.12);
    }
    .form-input::placeholder { color: #bbb; }

    /* ─── Tooltip ─── */
    [data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      background: var(--color-charcoal); color: #fff;
      font-size: 12px; padding: 4px 10px; border-radius: 6px;
      white-space: nowrap; pointer-events: none; z-index: 100;
    }

    /* ─── Loading screen ─── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 100000;
      background: var(--color-warm-white);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
      transition: opacity .6s, transform .6s;
    }
    #loading-screen.done {
      opacity: 0; pointer-events: none; transform: translateY(-20px);
    }
    .loading-ring {
      width: 56px; height: 56px; border-radius: 50%;
      border: 2px solid var(--color-stone);
      border-top-color: var(--color-ochre);
      animation: rotate-slow 1s linear infinite;
    }

    /* ─── Testimonial cards ─── */
    .testimonial-card {
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      border: 1px solid rgba(184,149,107,.1);
      transition: transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s;
    }
    .testimonial-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(0,0,0,.1);
    }

    /* ─── FAQ accordion ─── */
    .faq-item {
      border-bottom: 1px solid #eee;
    }
    .faq-answer {
      max-height: 0; overflow: hidden;
      transition: max-height .45s cubic-bezier(.16,1,.3,1), padding .45s;
    }
    .faq-answer.open { max-height: 400px; padding-bottom: 18px; }

    /* ─── Floating badge ─── */
    @keyframes badgeFloat {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-8px) rotate(2deg); }
    }
    .floating-badge { animation: badgeFloat 5s ease-in-out infinite; }

    /* pulse ring */
    .pulse-ring::after {
      content: '';
      position: absolute; inset: -8px; border-radius: 50%;
      border: 2px solid var(--color-ochre);
      animation: pulse-ring 2s ease-out infinite;
    }

    /* ─── Mobile ─── */
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor-dot, .cursor-outline { display: none !important; }
    }
  </style>
</head>

        text: "AI时代那场给了我很大的触动，思维框架清晰，带走的卡片我用了整整两个月。" },

    const faqs = [
      { q: "活动多长时间？场次安排是怎样的？",
        a: "大多数体验课为90–120分钟。场次安排在工作日晚间或周末，每月会提前在社群发布本月场次，可灵活选择适合自己的时段。" },

    const stats = [

    // ─────────────────────────────────────────────
    //  HOOK: useScrollReveal
    // ─────────────────────────────────────────────
    function useScrollReveal(ref, threshold = 0.15) {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(
          ([entry]) => { if (entry.isIntersecting) { setVisible(true); obs.disconnect(); } },
          { threshold }
        );
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return visible;
    }

    // ─────────────────────────────────────────────
    //  COMPONENT: CustomCursor
    // ─────────────────────────────────────────────
    const CustomCursor = () => {
      const dot = useRef(null);
      const ring = useRef(null);
      useEffect(() => {
        const move = (e) => {
          gsap.to(dot.current,  { x: e.clientX, y: e.clientY, duration: 0.08 });
          gsap.to(ring.current, { x: e.clientX, y: e.clientY, duration: 0.45, ease: "power2.out" });
        };
        window.addEventListener("mousemove", move);
        return () => window.removeEventListener("mousemove", move);
      }, []);
      return (
        <>
          <div ref={dot}  className="cursor-dot hidden md:block" />
          <div ref={ring} className="cursor-outline hidden md:block" />
        </>
      );
    };

    // ─────────────────────────────────────────────
    //  COMPONENT: Navigation
    // ─────────────────────────────────────────────

      const progress = useRef(null);

      useEffect(() => {
        const onScroll = () => {
          setScrolled(window.scrollY > 60);
          const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight);
          if (progress.current) progress.current.style.transform = `scaleX(${pct})`;

          ["hero","themes","process","space","about"].forEach(id => {

            if (el) {
              const rect = el.getBoundingClientRect();
              if (rect.top <= 120 && rect.bottom > 120) setActive(id);
            }
          });
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const links = [
        { id: "themes", label: "主题探索" },

            {/* Logo */}

                心
              </div>
              <div>
                <div className="font-serif-sc font-bold text-lg leading-none text-[#2C2C2C]">心屿空间</div>
                <div className="text-[10px] text-[#B8956B] tracking-[0.15em] uppercase">Heart Isle Space</div>
              </div>
            </a>

            {/* Desktop links */}
            <div className="hidden md:flex items-center gap-8">
              {links.map(l => (
                <a key={l.id} href={`#${l.id}`}
                   className={`nav-link text-sm font-medium transition-colors relative group ${active === l.id ? "text-[#B8956B] active" : "text-gray-600 hover:text-[#B8956B]"}`}>
                  <span className="nav-dot" />
                  {l.label}
                  <span className="absolute -bottom-1 left-0 w-0 h-px bg-[#B8956B] group-hover:w-full transition-all duration-300" />
                </a>
              ))}
              <a href="#about"
                 className="liquid-btn px-6 py-2.5 border-2 border-[#4A5D54] text-[#4A5D54] rounded-full text-sm font-semibold transition-all hover:shadow-lg hover:shadow-[#4A5D54]/20">
                立即预约
              </a>
            </div>

            {/* Mobile hamburger */}
            <button onClick={() => setMobileOpen(!mobileOpen)}
                    className="md:hidden w-10 h-10 flex flex-col justify-center items-center gap-1.5">

            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
              {testimonials.map((t, i) => (
                <div key={i} className="testimonial-card" style={{animationDelay:`${i*0.12}s`}}>
                  <i data-lucide="quote" className="w-8 h-8 mb-4 opacity-20" style={{ color: t.color }} />
                  <p className="text-gray-700 text-sm leading-relaxed mb-6 italic">"{t.text}"</p>
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm"
                         style={{ background: t.color }}>
                      {t.avatar}
                    </div>
                    <div>
                      <div className="font-semibold text-sm text-[#2C2C2C]">{t.name}</div>
                      <div className="text-xs text-gray-400">{t.role}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // ─────────────────────────────────────────────
    //  COMPONENT: FAQ
    // ─────────────────────────────────────────────
    const FAQ = () => {
      const [open, setOpen] = useState(null);
      const ref = useRef(null);
      const visible = useScrollReveal(ref);

      return (
        <section className="py-24 bg-[#F5F3EF]">
          <div className="max-w-3xl mx-auto px-6">
            <div ref={ref} className={`sr ${visible ? "visible" : ""} text-center mb-12`}>
              <span className="text-[#B8956B] text-xs font-bold tracking-[0.2em] uppercase mb-4 block">常见问题</span>
              <h2 className="font-serif-sc text-3xl md:text-4xl font-bold text-[#2C2C2C]">你可能想知道的</h2>
            </div>
            <div className="space-y-1">
              {faqs.map((f, i) => (
                <div key={i} className="faq-item">
                  <button className="w-full flex justify-between items-center py-5 text-left group"
                          onClick={() => setOpen(open === i ? null : i)}>
                    <span className={`font-semibold text-base transition-colors ${open===i ? "text-[#B8956B]" : "text-[#2C2C2C] group-hover:text-[#B8956B]"}`}>
                      {f.q}
                    </span>
                    <span className={`ml-4 flex-shrink-0 w-7 h-7 rounded-full border flex items-center justify-center transition-all duration-300
                      ${open===i ? "bg-[#B8956B] border-[#B8956B] rotate-45" : "border-gray-300 group-hover:border-[#B8956B]"}`}>
                      <span className={`text-xl leading-none font-light ${open===i ? "text-white" : "text-gray-400"}`}>+</span>
                    </span>
                  </button>
                  <div className={`faq-answer text-gray-500 text-sm leading-relaxed ${open===i ? "open" : ""}`}>
                    {f.a}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // ─────────────────────────────────────────────
    //  COMPONENT: BookingSection
    // ─────────────────────────────────────────────
    const BookingSection = () => {
      const [form, setForm] = useState({ name:"", contact:"", theme:"", message:"" });
      const [status, setStatus] = useState("idle"); // idle | loading | success
      const ref = useRef(null);
      const visible = useScrollReveal(ref);

      const upd = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const submit = (e) => {
        e.preventDefault();
        setStatus("loading");
        setTimeout(() => setStatus("success"), 1400);
        setTimeout(() => { setStatus("idle"); setForm({ name:"", contact:"", theme:"", message:"" }); }, 4000);
      };

      return (
        <section id="about" className="py-32 bg-white">
          <div className="max-w-5xl mx-auto px-6">
            <div ref={ref} className={`sr ${visible ? "visible" : ""}`}>
              <div className="grid md:grid-cols-2 gap-16 items-start">
                {/* Left copy */}
                <div className="pt-4">
                  <span className="text-[#B8956B] text-xs font-bold tracking-[0.2em] uppercase mb-4 block">开始体验</span>
                  <h2 className="font-serif-sc text-4xl font-bold text-[#2C2C2C] mb-6 leading-tight">
                    预约你的<br/>第一次心屿体验
                  </h2>
                  <p className="text-gray-500 leading-relaxed mb-8">
                    小班体验，名额有限。填写基本信息后，主理人何静会在24小时内与你确认具体时间与地点。
                  </p>
                  <div className="space-y-4">
                    {[
                      { icon:"map-pin", text:"深圳市内 · 具体地址预约后告知" },
                      { icon:"users", text:"12–20人小班，确保真实交流" },
                      { icon:"shield-check", text:"不满意全额退款，承诺品质" },
                      { icon:"calendar", text:"工作日晚间 & 周末，灵活选择" },
                    ].map((item, i) => (
                      <div key={i} className="flex items-center gap-3 text-sm text-gray-600">
                        <div className="w-8 h-8 rounded-lg bg-[#F5F3EF] flex items-center justify-center">
                          <i data-lucide={item.icon} className="w-4 h-4 text-[#B8956B]" />
                        </div>
                        {item.text}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Form */}
                <div className="glass-card rounded-[2rem] p-8 shadow-xl border border-gray-100">
                  {status === "success" ? (
                    <div className="text-center py-12">
                      <div className="w-20 h-20 rounded-full bg-green-50 flex items-center justify-center mx-auto mb-6">
                        <i data-lucide="check-circle" className="w-10 h-10 text-green-500" />
                      </div>
                      <h3 className="font-serif-sc text-2xl font-bold text-[#2C2C2C] mb-2">提交成功！</h3>
                      <p className="text-gray-500 text-sm">主理人何静会在24小时内联系你，期待与你相遇。</p>
                    </div>
                  ) : (
                    <form onSubmit={submit} className="space-y-5">
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wide">姓名</label>
                          <input className="form-input" placeholder="如何称呼您" value={form.name} onChange={e=>upd("name",e.target.value)} required />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wide">联系方式</label>
                          <input className="form-input" placeholder="微信或手机" value={form.contact} onChange={e=>upd("contact",e.target.value)} required />
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wide">感兴趣的主题</label>
                        <select className="form-input" value={form.theme} onChange={e=>upd("theme",e.target.value)} required>
                          <option value="">请选择主题</option>
                          {themes.map(t => <option key={t.id} value={t.id}>{t.title.substring(0,18)}…</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wide">留言（可选）</label>
                        <textarea className="form-input resize-none" rows="3"
                                  placeholder="简单描述你的困惑或期待…"
                                  value={form.message} onChange={e=>upd("message",e.target.value)} />
                      </div>
                      <button type="submit"
                              className={`w-full py-4 rounded-xl font-semibold text-white transition-all duration-300
                                ${status==="loading" ? "bg-gray-400" : "bg-[#4A5D54] hover:bg-[#3d4d46] hover:shadow-xl hover:shadow-[#4A5D54]/20 hover:-translate-y-0.5"}`}
                              disabled={status==="loading"}>
                        {status==="loading" ? (
                          <span className="flex items-center justify-center gap-2">
                            <span className="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin" />
                            提交中…
                          </span>
                        ) : "提交预约申请"}
                      </button>
                      <p className="text-center text-xs text-gray-400">提交即表示同意 · 主理人：何静</p>
                    </form>
                  )}
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ─────────────────────────────────────────────
    //  COMPONENT: Footer
    // ─────────────────────────────────────────────
    const Footer = () => {
      useEffect(() => { lucide.createIcons(); }, []);
      return (
        <footer className="bg-[#2C2C2C] text-white py-16">
          <div className="max-w-7xl mx-auto px-6">
            <div className="grid md:grid-cols-3 gap-12 mb-12">
              <div>
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-10 h-10 rounded-full bg-[#B8956B] flex items-center justify-center font-serif-sc font-bold">心</div>
                  <div>
                    <div className="font-serif-sc font-bold text-lg">心屿空间</div>
                    <div className="text-xs text-gray-400 tracking-widest">Heart Isle Space</div>
                  </div>
                </div>
                <p className="text-gray-400 text-sm leading-relaxed">
                  在高压城市里，认真活，认真成长。<br/>
                  为成年人提供真实对话与共学的空间。
                </p>
              </div>
              <div>
                <h4 className="font-semibold mb-4 text-sm uppercase tracking-wider text-gray-300">主题探索</h4>
                <ul className="space-y-2">
                  {themes.slice(0,4).map(t => (
                    <li key={t.id}>
                      <a href="#themes" className="text-gray-400 text-sm hover:text-[#B8956B] transition-colors">{t.title.substring(0,16)}…</a>
                    </li>
                  ))}
                </ul>
              </div>
              <div>
                <h4 className="font-semibold mb-4 text-sm uppercase tracking-wider text-gray-300">联系我们</h4>
                <div className="space-y-3">
                  {[
                    { icon:"map-pin", text:"深圳市 · 具体地点预约后告知" },
                    { icon:"user",    text:"主理人：何静" },
                    { icon:"globe",   text:"「给爱教育」创始人" },
                  ].map((item, i) => (
                    <div key={i} className="flex items-center gap-2 text-gray-400 text-sm">
                      <i data-lucide={item.icon} className="w-4 h-4 text-[#B8956B] flex-shrink-0" />
                      {item.text}
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-center gap-4 text-sm text-gray-500">
              <span>© 2026 心屿空间 Heart Isle Space. All rights reserved.</span>
              <span>在高压城市里，认真活，认真成长。</span>
            </div>
          </div>
        </footer>
      );
    };

    // ─────────────────────────────────────────────
    //  ROOT APP
    // ─────────────────────────────────────────────
    const App = () => {
      useEffect(() => {
        gsap.registerPlugin(ScrollTrigger, TextPlugin);
        lucide.createIcons();

        // Hide loading screen
        const ls = document.getElementById("loading-screen");
        setTimeout(() => { ls.classList.add("done"); }, 800);
      }, []);

      return (
        <div className="relative">
          <CustomCursor />
          <Navigation />
          <Hero />
          <Marquee />
          <ThemesSection />
          <ProcessTimeline />
          <SpaceShowcase />
          <Testimonials />
          <FAQ />
          <BookingSection />
          <Footer />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
