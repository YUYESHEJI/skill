<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圣斗士星矢 - 魂斗罗风格游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #fff;
    }
    #gameCanvas {
      border: 2px solid #333;
      image-rendering: pixelated;
    }
    .ui-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      padding: 10px;
      background: rgba(0,0,0,0.7);
      border-radius: 4px;
      font-size: 14px;
    }
    .controls {
      margin-top: 10px;
      text-align: center;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="480"></canvas>
  <div class="controls">
    方向键: 移动 | Z: 跳跃 | X: 攻击 | C: 特殊技能
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
