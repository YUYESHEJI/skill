<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圣斗士星矢 - 游戏生成器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
      color: #e0e0e0;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(180deg, rgba(255,200,0,0.1) 0%, transparent 100%);
      border-bottom: 2px solid rgba(255,200,0,0.3);
    }
    .header h1 {
      font-size: 2.5em;
      background: linear-gradient(90deg, #ffcc00, #ff6600, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255,200,0,0.3);
      margin-bottom: 8px;
    }
    .header p { color: #888; font-size: 1.1em; }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .step-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s;
    }
    .step-card:hover {
      border-color: rgba(255,200,0,0.3);
      box-shadow: 0 0 20px rgba(255,200,0,0.1);
    }
    .step-card.active {
      border-color: #ffcc00;
      box-shadow: 0 0 30px rgba(255,200,0,0.2);
    }
    .step-card.completed {
      border-color: #44ff44;
    }
    .step-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }
    .step-number {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffcc00, #ff6600);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      font-size: 1.1em;
    }
    .step-card.completed .step-number {
      background: linear-gradient(135deg, #44ff44, #00aa00);
    }
    .step-title {
      font-size: 1.2em;
      font-weight: 600;
    }
    .step-desc {
      color: #888;
      font-size: 0.9em;
      margin-bottom: 15px;
    }
    .upload-area {
      border: 2px dashed rgba(255,200,0,0.3);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 15px;
    }
    .upload-area:hover {
      border-color: #ffcc00;
      background: rgba(255,200,0,0.05);
    }
    .upload-area.has-image {
      border-color: #44ff44;
      background: rgba(68,255,68,0.05);
    }
    .upload-icon { font-size: 2.5em; margin-bottom: 10px; }
    .preview-image {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .config-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .config-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9em;
    }
    .config-row input[type="checkbox"] {
      accent-color: #ffcc00;
    }
    .config-row input[type="number"], .config-row select {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 6px 10px;
      color: #fff;
      width: 80px;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ffcc00, #ff6600);
      color: #000;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255,200,0,0.4);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.2);
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffcc00, #ff6600);
      border-radius: 4px;
      transition: width 0.3s;
    }
    .progress-text {
      font-size: 0.85em;
      color: #888;
      text-align: center;
    }
    .frame-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 8px;
      margin-top: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    .frame-item {
      aspect-ratio: 1;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .frame-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .frame-label {
      font-size: 0.7em;
      text-align: center;
      color: #888;
      padding: 2px;
    }
    .api-input {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    .api-input::placeholder { color: #666; }
    .game-preview {
      margin-top: 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .game-preview iframe {
      width: 100%;
      height: 500px;
      border: none;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 600;
    }
    .status-pending { background: rgba(255,255,255,0.1); color: #888; }
    .status-running { background: rgba(255,200,0,0.2); color: #ffcc00; }
    .status-done { background: rgba(68,255,68,0.2); color: #44ff44; }
    .status-error { background: rgba(255,68,68,0.2); color: #ff4444; }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .log-area {
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
    }
    .log-line { margin: 3px 0; }
    .log-info { color: #44aaff; }
    .log-success { color: #44ff44; }
    .log-error { color: #ff4444; }
    .log-warn { color: #ffcc00; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚔️ 圣斗士星矢 - 游戏生成器</h1>
    <p>基于 AI 的 2D 动作游戏自动生成系统</p>
  </div>

  <div class="container">
    <div class="step-card" id="apiCard">
      <div class="step-header">
        <div class="step-number">⚙</div>
        <div class="step-title">API 配置</div>
        <span class="status-badge status-pending" id="apiStatus">待配置</span>
      </div>
      <input type="password" class="api-input" id="apiKeyInput" placeholder="输入 Gemini API Key..." />
      <button class="btn btn-secondary" onclick="saveApiKey()">保存 API Key</button>
    </div>

    <div class="steps">
      <div class="step-card" id="step1">
        <div class="step-header">
          <div class="step-number">1</div>
          <div class="step-title">上传角色图像</div>
          <span class="status-badge status-pending" id="step1Status">待上传</span>
        </div>
        <div class="step-desc">上传角色参考图，系统将自动抠像并生成动作序列帧</div>
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">📤</div>
          <div>点击或拖拽上传角色图像</div>
          <div style="color:#666;font-size:0.85em;margin-top:5px">支持 PNG, JPG, WEBP</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileUpload(event)" />
        <img id="previewImage" class="preview-image" style="display:none" />
        <div class="action-buttons">
          <button class="btn btn-primary" id="btnRemoveBg" onclick="removeBackground()" disabled>🎨 抠像</button>
        </div>
        <img id="抠像Preview" class="preview-image" style="display:none" />
      </div>

      <div class="step-card" id="step2">
        <div class="step-header">
          <div class="step-number">2</div>
          <div class="step-title">生成动作序列帧</div>
          <span class="status-badge status-pending" id="step2Status">待生成</span>
        </div>
        <div class="step-desc">AI 将基于角色图像生成多种动作的序列帧</div>
        <div class="config-row">
          <label><input type="checkbox" id="actionIdle" checked /> 待机</label>
          <label><input type="checkbox" id="actionWalk" checked /> 行走</label>
          <label><input type="checkbox" id="actionRun" checked /> 奔跑</label>
          <label><input type="checkbox" id="actionJump" checked /> 跳跃</label>
          <label><input type="checkbox" id="actionAttack" checked /> 攻击</label>
          <label><input type="checkbox" id="actionSpecial" checked /> 必杀技</label>
        </div>
        <div class="config-row">
          <label>每动作帧数: <input type="number" id="framesPerAction" value="6" min="3" max="12" /></label>
          <label>分辨率: <input type="number" id="resolution" value="64" min="32" max="128" step="16" /></label>
        </div>
        <div class="progress-bar" style="display:none" id="frameProgress">
          <div class="progress-fill" id="frameProgressFill" style="width:0%"></div>
        </div>
        <div class="progress-text" id="frameProgressText"></div>
        <div class="action-buttons">
          <button class="btn btn-primary" id="btnGenerateFrames" onclick="generateFrames()" disabled>🎬 生成序列帧</button>
        </div>
        <div class="frame-grid" id="frameGrid"></div>
      </div>

      <div class="step-card" id="step3">
        <div class="step-header">
          <div class="step-number">3</div>
          <div class="step-title">生成关卡资产</div>
          <span class="status-badge status-pending" id="step3Status">待生成</span>
        </div>
        <div class="step-desc">生成背景、敌人、道具等关卡所需资产</div>
        <div class="config-row">
          <label>关卡主题:
            <select id="levelTheme">
              <option value="temple">希腊神殿</option>
              <option value="volcano">火山地狱</option>
              <option value="ocean">海底神殿</option>
              <option value="sky">天空竞技场</option>
            </select>
          </label>
        </div>
        <div class="progress-bar" style="display:none" id="assetProgress">
          <div class="progress-fill" id="assetProgressFill" style="width:0%"></div>
        </div>
        <div class="progress-text" id="assetProgressText"></div>
        <div class="action-buttons">
          <button class="btn btn-primary" id="btnGenerateAssets" onclick="generateAssets()" disabled>🏗️ 生成关卡资产</button>
        </div>
      </div>

      <div class="step-card" id="step4">
        <div class="step-header">
          <div class="step-number">4</div>
          <div class="step-title">构建游戏</div>
          <span class="status-badge status-pending" id="step4Status">待构建</span>
        </div>
        <div class="step-desc">将所有资产整合到可运行的游戏中</div>
        <div class="action-buttons">
          <button class="btn btn-primary" id="btnBuildGame" onclick="buildGame()" disabled> 构建游戏</button>
          <button class="btn btn-secondary" id="btnExport" onclick="exportGame()" disabled>📦 导出</button>
        </div>
      </div>
    </div>

    <div class="game-preview" id="gamePreview" style="display:none">
      <div style="padding:15px;background:rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600">🎮 游戏预览</span>
        <span style="color:#888;font-size:0.85em">方向键移动 | Z跳跃 | X攻击 | C必杀技</span>
      </div>
      <iframe id="gameFrame"></iframe>
    </div>

    <div class="log-area" id="logArea">
      <div class="log-line log-info">系统就绪，等待操作...</div>
    </div>
  </div>

  <script type="module">
    import { geminiService } from './src/services/GeminiService.js';
    import { assetGenerator } from './src/services/AssetGenerator.js';
    import { imageProcessor } from './src/services/ImageProcessor.js';

    window.geminiService = geminiService;
    window.assetGenerator = assetGenerator;
    window.imageProcessor = imageProcessor;

    let characterImage = null;
    let 抠像Image = null;
    let characterFrames = {};
    let levelAssets = {};

    window.saveApiKey = function() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) {
        addLog('请输入 API Key', 'error');
        return;
      }
      geminiService.setApiKey(key);
      document.getElementById('apiStatus').textContent = '已配置';
      document.getElementById('apiStatus').className = 'status-badge status-done';
      document.getElementById('apiCard').classList.add('completed');
      addLog('API Key 已保存', 'success');
    };

    window.handleFileUpload = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        characterImage = e.target.result;
        const preview = document.getElementById('previewImage');
        preview.src = characterImage;
        preview.style.display = 'block';
        document.getElementById('uploadArea').classList.add('has-image');
        document.getElementById('btnRemoveBg').disabled = false;
        document.getElementById('step1Status').textContent = '已上传';
        document.getElementById('step1Status').className = 'status-badge status-done';
        document.getElementById('step1').classList.add('completed');
        addLog(`图像已上传: ${file.name} (${(file.size/1024).toFixed(1)}KB)`, 'success');
      };
      reader.readAsDataURL(file);
    };

    window.removeBackground = async function() {
      if (!characterImage) return;
      addLog('开始抠像处理...', 'info');
      document.getElementById('step1Status').textContent = '处理中';
      document.getElementById('step1Status').className = 'status-badge status-running';

      try {
        抠像Image = await imageProcessor.removeBackgroundSimple(characterImage);
        const preview = document.getElementById('抠像Preview');
        preview.src = 抠像Image;
        preview.style.display = 'block';
        document.getElementById('btnGenerateFrames').disabled = false;
        document.getElementById('step1Status').textContent = '已完成';
        document.getElementById('step1Status').className = 'status-badge status-done';
        addLog('抠像完成！', 'success');
      } catch (error) {
        addLog(`抠像失败: ${error.message}`, 'error');
        document.getElementById('step1Status').textContent = '失败';
        document.getElementById('step1Status').className = 'status-badge status-error';
      }
    };

    window.generateFrames = async function() {
      const sourceImage = 抠像Image || characterImage;
      if (!sourceImage) return;

      const actions = [];
      if (document.getElementById('actionIdle').checked) actions.push('idle');
      if (document.getElementById('actionWalk').checked) actions.push('walk');
      if (document.getElementById('actionRun').checked) actions.push('run');
      if (document.getElementById('actionJump').checked) actions.push('jump');
      if (document.getElementById('actionAttack').checked) actions.push('attack');
      if (document.getElementById('actionSpecial').checked) actions.push('special');

      const framesPerAction = parseInt(document.getElementById('framesPerAction').value) || 6;

      addLog(`开始生成动作序列帧: ${actions.join(', ')} (每动作${framesPerAction}帧)`, 'info');
      document.getElementById('step2Status').textContent = '生成中';
      document.getElementById('step2Status').className = 'status-badge status-running';
      document.getElementById('step2').classList.add('active');
      document.getElementById('frameProgress').style.display = 'block';
      document.getElementById('btnGenerateFrames').disabled = true;

      const totalFrames = actions.length * framesPerAction;
      let completed = 0;
      const frameGrid = document.getElementById('frameGrid');
      frameGrid.innerHTML = '';

      try {
        for (const action of actions) {
          characterFrames[action] = [];
          for (let i = 0; i < framesPerAction; i++) {
            addLog(`生成 ${action} 第 ${i+1}/${framesPerAction} 帧...`, 'info');
            const frame = await geminiService.generateActionFrame(sourceImage, action, i, framesPerAction);
            characterFrames[action].push({ id: `${action}_${i}`, dataUrl: frame, index: i });

            const frameItem = document.createElement('div');
            frameItem.className = 'frame-item';
            frameItem.innerHTML = `<img src="${frame}" /><div class="frame-label">${action} ${i+1}</div>`;
            frameGrid.appendChild(frameItem);

            completed++;
            const percent = Math.round((completed / totalFrames) * 100);
            document.getElementById('frameProgressFill').style.width = percent + '%';
            document.getElementById('frameProgressText').textContent = `${completed}/${totalFrames} (${percent}%)`;
          }
        }

        document.getElementById('step2Status').textContent = '已完成';
        document.getElementById('step2Status').className = 'status-badge status-done';
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step2').classList.add('completed');
        document.getElementById('btnGenerateAssets').disabled = false;
        addLog(`动作序列帧生成完成！共 ${completed} 帧`, 'success');
      } catch (error) {
        addLog(`生成失败: ${error.message}`, 'error');
        document.getElementById('step2Status').textContent = '失败';
        document.getElementById('step2Status').className = 'status-badge status-error';
        document.getElementById('btnGenerateFrames').disabled = false;
      }
    };

    window.generateAssets = async function() {
      const theme = document.getElementById('levelTheme').value;
      addLog(`开始生成关卡资产 (主题: ${theme})...`, 'info');
      document.getElementById('step3Status').textContent = '生成中';
      document.getElementById('step3Status').className = 'status-badge status-running';
      document.getElementById('step3').classList.add('active');
      document.getElementById('assetProgress').style.display = 'block';
      document.getElementById('btnGenerateAssets').disabled = true;

      try {
        levelAssets = await assetGenerator.generateLevelAssets(theme);
        document.getElementById('assetProgressFill').style.width = '100%';
        document.getElementById('assetProgressText').textContent = `背景:${levelAssets.backgrounds.length} 敌人:${levelAssets.enemies.length} 道具:${levelAssets.items.length}`;
        document.getElementById('step3Status').textContent = '已完成';
        document.getElementById('step3Status').className = 'status-badge status-done';
        document.getElementById('step3').classList.remove('active');
        document.getElementById('step3').classList.add('completed');
        document.getElementById('btnBuildGame').disabled = false;
        addLog('关卡资产生成完成！', 'success');
      } catch (error) {
        addLog(`生成失败: ${error.message}`, 'error');
        document.getElementById('step3Status').textContent = '失败';
        document.getElementById('step3Status').className = 'status-badge status-error';
        document.getElementById('btnGenerateAssets').disabled = false;
      }
    };

    window.buildGame = function() {
      addLog('构建游戏中...', 'info');
      document.getElementById('step4Status').textContent = '构建中';
      document.getElementById('step4Status').className = 'status-badge status-running';

      const gameHtml = generateGameHtml();
      const frame = document.getElementById('gameFrame');
      frame.srcdoc = gameHtml;
      document.getElementById('gamePreview').style.display = 'block';

      document.getElementById('step4Status').textContent = '已完成';
      document.getElementById('step4Status').className = 'status-badge status-done';
      document.getElementById('step4').classList.add('completed');
      document.getElementById('btnExport').disabled = false;
      addLog('游戏构建完成！', 'success');
    };

    window.exportGame = function() {
      const gameHtml = generateGameHtml();
      const blob = new Blob([gameHtml], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'saint-seiya-game.html';
      a.click();
      URL.revokeObjectURL(url);
      addLog('游戏已导出为 HTML 文件', 'success');
    };

    function generateGameHtml() {
      return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>圣斗士星矢</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}canvas{border:2px solid #333;image-rendering:pixelated}</style>
</head><body><canvas id="g" width="800" height="480"></canvas>
<script>
const C=document.getElementById('g'),X=C.getContext('2d');
const frames=${JSON.stringify(characterFrames)};
const assets=${JSON.stringify(levelAssets)};
let P={x:100,y:300,vx:0,vy:0,state:'idle',frame:0,health:100,maxHealth:100,facing:1,attacking:false,attackTimer:0,specialReady:true,specialCooldown:0,onGround:false};
let keys={},enemies=[],projectiles=[],particles=[],score=0,lives=3,cameraX=0;
const platforms=[{x:0,y:420,w:5000,h:60}];
for(let i=0;i<20;i++)platforms.push({x:200+i*200,y:200+Math.random()*150,w:80+Math.random()*80,h:16});
for(let i=0;i<10;i++)enemies.push({x:400+i*300,y:370,w:40,h:50,vx:0,health:50,maxHealth:50,frame:0});
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='z'&&P.onGround){P.vy=-12;P.onGround=false;P.state='jump'}if(e.key==='x'&&!P.attacking){P.attacking=true;P.attackTimer=15;P.state='attack';projectiles.push({x:P.x+(P.facing>0?48:-20),y:P.y+20,vx:P.facing*8,dmg:25,life:60})}if(e.key==='c'&&P.specialReady){P.specialReady=false;P.specialCooldown=180;P.state='special';for(let i=0;i<8;i++){const a=i/8*Math.PI*2;projectiles.push({x:P.x+24,y:P.y+32,vx:Math.cos(a)*5,vy:Math.sin(a)*5,dmg:40,life:90,type:'cosmic'})}}});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function update(){
if(keys['arrowleft']||keys['a']){P.vx=-4;P.facing=-1;if(P.onGround)P.state='walk'}
else if(keys['arrowright']||keys['d']){P.vx=4;P.facing=1;if(P.onGround)P.state='walk'}
else{P.vx=0;if(P.onGround&&!P.attacking)P.state='idle'}
P.vy+=0.6;P.x+=P.vx;P.y+=P.vy;P.onGround=false;
for(const p of platforms){if(P.x+48>p.x&&P.x<p.x+p.w&&P.y+64>p.y&&P.y+64<p.y+p.h+10&&P.vy>=0){P.y=p.y-64;P.vy=0;P.onGround=true}}
if(P.y>500){P.health=0}
if(P.attackTimer>0){P.attackTimer--;if(P.attackTimer===0)P.attacking=false}
if(P.specialCooldown>0){P.specialCooldown--;if(P.specialCooldown===0)P.specialReady=true}
P.frame=(P.frame+0.15)%6;
for(let i=projectiles.length-1;i>=0;i--){const pr=projectiles[i];pr.x+=pr.vx;if(pr.vy)pr.y+=pr.vy;pr.life--;if(pr.life<=0){projectiles.splice(i,1);continue}
for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(Math.abs(pr.x-e.x)<30&&Math.abs(pr.y-e.y)<30){e.health-=pr.dmg;projectiles.splice(i,1);if(e.health<=0){enemies.splice(j,1);score+=100}break}}}
for(const e of enemies){const dx=P.x-e.x;if(Math.abs(dx)<300)e.vx=dx>0?1.5:-1.5;e.x+=e.vx;e.frame=(e.frame||0)+0.1;
if(Math.abs(P.x-e.x)<40&&Math.abs(P.y-e.y)<50&&!P.attacking){P.health-=5;P.vx=(P.x<e.x?-1:1)*5}}
cameraX=P.x-200;if(cameraX<0)cameraX=0;
if(P.health<=0){lives--;if(lives>0){P.health=100;P.x=100;P.y=300}else{P.health=0}}
}
function draw(){
X.clearRect(0,0,800,480);
const grd=X.createLinearGradient(0,0,0,480);grd.addColorStop(0,'#1a0a2e');grd.addColorStop(1,'#0d0520');X.fillStyle=grd;X.fillRect(0,0,800,480);
X.save();X.translate(-cameraX,0);
for(const p of platforms){X.fillStyle='#4a4a6a';X.fillRect(p.x,p.y,p.w,p.h);X.fillStyle='#6a6a8a';X.fillRect(p.x,p.y,p.w,4)}
for(const e of enemies){X.fillStyle='#aa3333';X.fillRect(e.x,e.y,e.w,e.h);X.fillStyle='#333';X.fillRect(e.x,e.y-8,e.w,4);X.fillStyle='#44ff44';X.fillRect(e.x,e.y-8,e.w*(e.health/e.maxHealth),4)}
const f=frames[P.state]||frames['idle'];const cf=f[Math.floor(P.frame)%f.length];
if(cf){const img=new Image();img.src=cf.dataUrl;X.save();if(P.facing<0){X.translate(P.x+48,P.y);X.scale(-1,1);X.drawImage(img,0,0,48,64)}else{X.drawImage(img,P.x,P.y,48,64)}X.restore()}else{X.fillStyle='#44aaff';X.fillRect(P.x,P.y,48,64)}
if(P.attacking){X.fillStyle='rgba(255,200,0,0.6)';X.fillRect(P.facing>0?P.x+48:P.x-30,P.y+15,30,20)}
for(const pr of projectiles){if(pr.type==='cosmic'){X.fillStyle='#ffdd44';X.beginPath();X.arc(pr.x,pr.y,8,0,Math.PI*2);X.fill()}else{X.fillStyle='#ffaa00';X.fillRect(pr.x,pr.y,20,10)}}
X.restore();
X.fillStyle='rgba(0,0,0,0.7)';X.fillRect(10,10,200,25);X.fillStyle='#333';X.fillRect(15,15,190,15);X.fillStyle=P.health>50?'#44ff44':'#ff4444';X.fillRect(15,15,190*(P.health/100),15);
X.fillStyle='#fff';X.font='12px monospace';X.fillText('HP:'+Math.ceil(P.health),20,27);
X.fillStyle='rgba(0,0,0,0.7)';X.fillRect(640,10,150,25);X.fillStyle='#ffdd44';X.fillText('SCORE:'+score,650,27);
X.fillStyle='#fff';X.font='12px monospace';X.fillText('LIVES:'+lives,380,27);
if(P.specialReady){X.fillStyle='rgba(255,200,0,0.8)';X.fillText('★SPECIAL[C]',350,460)}
if(P.health<=0&&lives<=0){X.fillStyle='rgba(0,0,0,0.8)';X.fillRect(0,0,800,480);X.fillStyle='#fff';X.font='36px monospace';X.textAlign='center';X.fillText('GAME OVER',400,220);X.font='18px monospace';X.fillText('Score:'+score,400,260);X.fillText('Press R to Restart',400,300);X.textAlign='left'}
}
function loop(){update();draw();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&P.health<=0&&lives<=0){P.health=100;lives=3;score=0;P.x=100;P.y=300;enemies=[];for(let i=0;i<10;i++)enemies.push({x:400+i*300,y:370,w:40,h:50,vx:0,health:50,maxHealth:50,frame:0})}});
loop();
<\/script></body></html>`;
    }

    function addLog(message, type = 'info') {
      const logArea = document.getElementById('logArea');
      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      const time = new Date().toLocaleTimeString();
      line.textContent = `[${time}] ${message}`;
      logArea.appendChild(line);
      logArea.scrollTop = logArea.scrollHeight;
    }

    window.addLog = addLog;

    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
      document.getElementById('apiKeyInput').value = savedKey;
      geminiService.setApiKey(savedKey);
      document.getElementById('apiStatus').textContent = '已配置';
      document.getElementById('apiStatus').className = 'status-badge status-done';
      document.getElementById('apiCard').classList.add('completed');
    }
  </script>
</body>
</html>
